<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4tif Video Patcher</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #252525, #0b0b0b 58%); color: #f7f7f7; }
    main { width: min(560px, calc(100% - 32px)); text-align: center; padding: 48px 22px; }
    h1 { margin: 0; font: 400 clamp(2.3rem, 8vw, 4rem)/1 Georgia, serif; letter-spacing: .04em; }
    p { color: #b7b7b7; line-height: 1.55; }
    .card { margin-top: 30px; padding: 28px; border: 1px solid #3b3b3b; border-radius: 18px; background: #151515; box-shadow: 0 18px 60px #0008; }
    .drop { display: block; padding: 30px 16px; border: 1px dashed #616161; border-radius: 12px; cursor: pointer; transition: .18s ease; }
    .drop:hover, .drop.over { border-color: #fff; background: #202020; }
    input { display: none; }
    .file { min-height: 22px; margin: 16px 0 20px; color: #ddd; font-size: .92rem; overflow-wrap: anywhere; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; }
    .mode { position: relative; display: block; padding: 12px 8px; border: 1px solid #4d4d4d; border-radius: 9px; cursor: pointer; color: #bdbdbd; font-size: .85rem; }
    .mode:has(input:checked) { border-color: #ededed; background: #292929; color: #fff; }
    .mode input { position: absolute; opacity: 0; pointer-events: none; }
    button { width: 100%; border: 0; border-radius: 9px; padding: 13px 18px; cursor: pointer; background: #f4f4f4; color: #111; font-weight: 750; letter-spacing: .05em; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    progress { width: 100%; height: 9px; margin-top: 19px; accent-color: #5eea80; }
    #status { min-height: 24px; margin: 14px 0 0; font-size: .88rem; }
    .note { margin-top: 25px; font-size: .8rem; color: #858585; }
    footer { margin-top: 30px; color: #8b8b8b; font-size: .78rem; line-height: 1.8; }
    footer a { color: #d7d7d7; text-decoration: none; }
    footer a:hover { color: #fff; text-decoration: underline; }
    .error { color: #ff9595; }
    .success { color: #8ef1a7; }
  </style>
</head>
<body>
  <main>
    <h1>4tif</h1>
    <p>Patch an MP4 or MOV locally. Your video never leaves this device.</p>
    <section class="card">
      <label class="drop" id="dropZone" for="videoInput">Choose video or drop it here<input id="videoInput" type="file" accept="video/mp4,video/quicktime,.mp4,.mov"></label>
      <div class="file" id="fileName">No video selected</div>
      <div class="modes" aria-label="Video frame rate">
        <label class="mode"><input type="radio" name="fps" value="2" checked>60 FPS video</label>
        <label class="mode"><input type="radio" name="fps" value="6">120 FPS video</label>
      </div>
      <button id="patchButton" disabled>PATCH VIDEO</button>
      <progress id="progress" value="0" max="100" hidden></progress>
      <div id="status" aria-live="polite"></div>
    </section>
    <p class="note">This is a static website. It does not upload, store, or re-encode your file.</p>
    <footer>
      <div>© 2026 4tif by Atip. Not for resale.</div>
      <div>Discord: <a href="https://discord.com/users/390376808526381059" target="_blank" rel="noopener">@47if</a> · Telegram: <a href="https://t.me/a4tif" target="_blank" rel="noopener">@a4tif</a> · TikTok: <a href="https://www.tiktok.com/@atip.png" target="_blank" rel="noopener">@atip.png</a></div>
    </footer>
  </main>
  <script>
    const input = document.querySelector('#videoInput');
    const dropZone = document.querySelector('#dropZone');
    const fileName = document.querySelector('#fileName');
    const patchButton = document.querySelector('#patchButton');
    const progress = document.querySelector('#progress');
    const status = document.querySelector('#status');
    let selectedFile;

    function selectFile(file) {
      if (!file) return;
      const valid = /\.(mp4|mov)$/i.test(file.name);
      if (!valid) { show('Choose an MP4 or MOV video.', 'error'); return; }
      selectedFile = file;
      fileName.textContent = `${file.name} — ${formatBytes(file.size)}`;
      patchButton.disabled = false;
      show('Ready to patch.');
    }
    function show(message, kind = '') { status.textContent = message; status.className = kind; }
    function formatBytes(size) { return size < 1048576 ? `${(size / 1024).toFixed(1)} KB` : `${(size / 1048576).toFixed(1)} MB`; }
    input.addEventListener('change', () => selectFile(input.files[0]));
    ['dragenter', 'dragover'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.remove('over'); }));
    dropZone.addEventListener('drop', e => selectFile(e.dataTransfer.files[0]));

    // ISO Base Media File Format parser. Patches the same mvhd/mdhd timing fields as the desktop app.
    function patchMovieHeaders(bytes, scaleFactor) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const decoder = new TextDecoder('latin1');
      let patched = 0;
      const containers = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'edts', 'udta', 'meta', 'dinf']);
      function typeAt(offset) { return decoder.decode(bytes.subarray(offset + 4, offset + 8)); }
      function walk(start, end) {
        let offset = start;
        while (offset + 8 <= end) {
          let size = view.getUint32(offset, false);
          const type = typeAt(offset);
          let header = 8;
          if (size === 1) { if (offset + 16 > end) break; size = Number(view.getBigUint64(offset + 8, false)); header = 16; }
          if (size === 0) size = end - offset;
          if (size < header || offset + size > end) break;
          const data = offset + header;
          if (type === 'mvhd' || type === 'mdhd') patched += patchHeader(view, data, offset + size, scaleFactor);
          if (containers.has(type)) walk(data + (type === 'meta' ? 4 : 0), offset + size);
          offset += size;
        }
      }
      walk(0, bytes.length);
      return patched;
    }
    function patchHeader(view, data, end, scaleFactor) {
      if (data + 4 > end) return 0;
      const version = view.getUint8(data);
      const timescaleOffset = data + (version === 1 ? 20 : 12);
      if (timescaleOffset + 4 > end) return 0;
      const original = view.getUint32(timescaleOffset, false);
      if (!original) return 0;
      view.setUint32(timescaleOffset, Math.max(1, Math.floor(original / scaleFactor)), false);
      return 1;
    }
    async function patch() {
      if (!selectedFile) return;
      patchButton.disabled = true; progress.hidden = false; progress.value = 10; show('Reading video…');
      try {
        const bytes = new Uint8Array(await selectedFile.arrayBuffer());
        progress.value = 70; show('Patching video metadata…');
        const scaleFactor = Number(document.querySelector('input[name="fps"]:checked').value);
        const count = patchMovieHeaders(bytes, scaleFactor);
        if (!count) throw new Error('No compatible MP4 timing metadata was found.');
        progress.value = 90; show('Preparing download…');
        const extension = selectedFile.name.match(/\.[^.]+$/)?.[0] || '.mp4';
        const base = selectedFile.name.slice(0, -extension.length);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([bytes], { type: selectedFile.type || 'video/mp4' }));
        link.download = `${base}_4tif${extension}`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        progress.value = 100; show(`Done — patched for ${scaleFactor === 2 ? '60' : '120'} FPS (${count} timing header${count === 1 ? '' : 's'}).`, 'success');
      } catch (error) { show(error.message || 'Could not patch this video.', 'error'); }
      finally { patchButton.disabled = false; setTimeout(() => { progress.hidden = true; progress.value = 0; }, 900); }
    }
    patchButton.addEventListener('click', patch);
  </script>
</body>
</html>
