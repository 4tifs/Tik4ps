<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4tif Video Patcher</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#252525,#0b0b0b 58%);color:#f7f7f7}
main{width:min(560px,calc(100% - 32px));text-align:center;padding:48px 22px}
h1{margin:0;font:400 clamp(2.3rem,8vw,4rem)/1 Georgia,serif;letter-spacing:.04em}
p{color:#b7b7b7;line-height:1.55}
.card{margin-top:30px;padding:28px;border:1px solid #3b3b3b;border-radius:18px;background:#151515;box-shadow:0 18px 60px #0008}
.drop{display:block;padding:30px 16px;border:1px dashed #616161;border-radius:12px;cursor:pointer;transition:.18s ease}
.drop:hover,.drop.over{border-color:#fff;background:#202020}
input{display:none}
.file{min-height:22px;margin:16px 0 20px;color:#ddd;font-size:.92rem;overflow-wrap:anywhere}
button{width:100%;border:0;border-radius:9px;padding:13px 18px;cursor:pointer;background:#f4f4f4;color:#111;font-weight:750;letter-spacing:.05em}
button:disabled{opacity:.42;cursor:not-allowed}
progress{width:100%;height:9px;margin-top:19px;accent-color:#5eea80}
#status{min-height:24px;margin:14px 0 0;font-size:.88rem}
.note{margin-top:25px;font-size:.8rem;color:#858585}
footer{margin-top:30px;color:#8b8b8b;font-size:.78rem;line-height:1.8}
.error{color:#ff9595}.success{color:#8ef1a7}
</style>
</head>
<body>
<main>
<h1>4tif</h1>
<p>Patch an MP4 or MOV locally. Your video never leaves this device.</p>
<section class="card">
<label class="drop" id="drop" for="file">Choose video or drop it here
<input id="file" type="file" accept="video/mp4,.mp4">
</label>
<div class="file" id="name">No video selected</div>
<button id="patch" disabled>PATCH VIDEO</button>
<progress id="progress" value="0" max="100" hidden></progress>
<div id="status"></div>
</section>
<p class="note">This is a static website. It does not upload, store, or re-encode your file.</p>
<footer>© 2026 4tif by Atip. Not for resale.</footer>
</main>
<script>
const $=s=>document.querySelector(s);
let selected=null;
const file=$('#file'), drop=$('#drop'), name=$('#name'), btn=$('#patch'), prog=$('#progress'), status=$('#status');

function fmt(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function show(s,c=''){status.textContent=s;status.className=c}
function choose(f){
 if(!f)return;
 if(!/\.mp4$/i.test(f.name)){show('Choose an MP4 video.','error');return}
 selected=f;name.textContent=`${f.name} — ${fmt(f.size)}`;btn.disabled=false;show('Ready to patch.')
}
file.onchange=()=>choose(file.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));

function u32(a,o){return new DataView(a.buffer,a.byteOffset,a.byteLength).getUint32(o,false)}
function put32(a,o,v){new DataView(a.buffer,a.byteOffset,a.byteLength).setUint32(o,v>>>0,false)}
function type(a,o){return new TextDecoder('latin1').decode(a.subarray(o+4,o+8))}
function box(t,p){let a=new Uint8Array(8+p.length);put32(a,0,a.length);a.set(t,4);a.set(p,8);return a}
const moovT=new TextEncoder().encode('moov'),trakT=new TextEncoder().encode('trak'),
mdiaT=new TextEncoder().encode('mdia'),minfT=new TextEncoder().encode('minf'),stblT=new TextEncoder().encode('stbl'),
sttsT=new TextEncoder().encode('stts'),stscT=new TextEncoder().encode('stsc'),stszT=new TextEncoder().encode('stsz'),
stcoT=new TextEncoder().encode('stco'),tkhdT=new TextEncoder().encode('tkhd'),mdhdT=new TextEncoder().encode('mdhd'),
hdlrT=new TextEncoder().encode('hdlr'),videT=new TextEncoder().encode('vide'),sounT=new TextEncoder().encode('soun'),
edtsT=new TextEncoder().encode('edts'),udtaT=new TextEncoder().encode('udta'),metaT=new TextEncoder().encode('meta'),
ilstT=new TextEncoder().encode('ilst'),dataT=new TextEncoder().encode('data'),toolT=new Uint8Array([0xa9,0x74,0x6f,0x6f]),
cmtT=new Uint8Array([0xa9,0x63,0x6d,0x74]),nameT=new TextEncoder().encode('name');

function eq(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
function boxes(a,start,end){
 let out=[],i=start;
 while(i+8<=end){
  let n=u32(a,i),h=8;
  if(n===1){n=Number(new DataView(a.buffer,a.byteOffset,a.byteLength).getBigUint64(i+8,false));h=16}
  else if(n===0)n=end-i;
  if(n<h||i+n>end)throw Error('bad MP4 box');
  out.push({t:a.slice(i+4,i+8),i,n,h,x:a.slice(i,i+n)});i+=n;
 }
 if(i!==end)throw Error('box alignment'); return out
}
function child(b,t,idx=0){let a=boxes(b,8,b.length).filter(x=>eq(x.t,t)).map(x=>x.x);if(idx>=a.length)throw Error('missing MP4 box');return a[idx]}
function rebuild(b,repl=new Map(),remove=[]){
 let seen=new Map(),parts=[];
 for(const x of boxes(b,8,b.length)){
  if(remove.some(t=>eq(t,x.t)))continue;
  let k=seen.get(new TextDecoder().decode(x.t))||0;seen.set(new TextDecoder().decode(x.t),k+1);
  parts.push(repl.get((new TextDecoder().decode(x.t))+':'+k)||x.x)
 }
 return box(b.slice(4,8),concat(parts))
}
function concat(parts){let n=parts.reduce((s,a)=>s+a.length,0),o=new Uint8Array(n),p=0;for(const a of parts){o.set(a,p);p+=a.length}return o}

function sttsRead(b){
 let p=b.slice(8),n=u32(p,4),a=[];
 for(let i=0;i<n;i++)a.push([u32(p,8+i*8),u32(p,12+i*8)]);
 return [p.slice(0,4),a]
}
function sttsWrite(v,a){let p=new Uint8Array(8+a.length*8);p.set(v,0);put32(p,4,a.length);a.forEach((x,i)=>{put32(p,8+i*8,x[0]);put32(p,12+i*8,x[1])});return box(sttsT,p)}
function stscRead(b){let p=b.slice(8),n=u32(p,4),a=[];for(let i=0;i<n;i++)a.push([u32(p,8+i*12),u32(p,12+i*12),u32(p,16+i*12)]);return [p.slice(0,4),a]}
function stscWrite(v,a){let p=new Uint8Array(8+a.length*12);p.set(v);put32(p,4,a.length);a.forEach((x,i)=>x.forEach((z,j)=>put32(p,8+i*12+j*4,z)));return box(stscT,p)}
function stcoRead(b){let p=b.slice(8),n=u32(p,4),a=[];for(let i=0;i<n;i++)a.push(u32(p,8+i*4));return [p.slice(0,4),a]}
function stcoWrite(v,a){let p=new Uint8Array(8+a.length*4);p.set(v);put32(p,4,a.length);a.forEach((x,i)=>put32(p,8+i*4,x));return box(stcoT,p)}
function stszRead(b){let p=b.slice(8),ss=u32(p,4),n=u32(p,8);if(ss)return [p.slice(0,4),Array(n).fill(ss)];let a=[];for(let i=0;i<n;i++)a.push(u32(p,12+i*4));return[p.slice(0,4),a]}
function stszWrite(v,a){let p=new Uint8Array(12+a.length*4);p.set(v);put32(p,4,0);put32(p,8,a.length);a.forEach((x,i)=>put32(p,12+i*4,x));return box(stszT,p)}
function handler(t){return child(child(t,mdiaT),hdlrT).slice(16,20)}

function dataText(s){let b=new TextEncoder().encode(s),p=new Uint8Array(8+b.length);put32(p,0,1);put32(p,4,0);p.set(b,8);return box(dataT,p)}
function item(n,s){return box(n,dataText(s))}
function metaIlst(items){return box(metaT,concat([new Uint8Array(4),box(ilstT,concat(items))]))}
function siteUdta(){
 return box(udtaT,concat([
  metaIlst([item(toolT,'Lavf59.27.100'),item(cmtT,'Patched by compressbase.com')]),
  metaIlst([box(nameT,dataText('gg/maska')),item(cmtT,'Patched by compressbase.com')])
 ]))
}
function patchAudio(t,delta,synthetic=false,synthOffset=0,synthCount=0,newid=null){
 t=rebuild(t,new Map(),[edtsT]);
 let tk=new Uint8Array(child(t,tkhdT));if(newid!==null)put32(tk,20,newid);
 t=rebuild(t,new Map([['tkhd:0',box(tk.slice(4,8),tk.slice(8))]]));
 let md=child(t,mdiaT), mdhd=new Uint8Array(child(md,mdhdT)), minf=child(md,minfT), stbl=child(minf,stblT);
 let [v,tt]=sttsRead(child(stbl,sttsT));if(tt.length&&tt.at(-1)[0]>1)tt.at(-1)[0]-=1;tt.push([1,1001]);if(synthetic)tt.push([synthCount,1]);
 let total=tt.reduce((s,x)=>s+x[0]*x[1],0);put32(mdhd,24,total);
 md=rebuild(md,new Map([['mdhd:0',mdhd]]));stbl=rebuild(stbl,new Map([['stts:0',sttsWrite(v,tt)]]));
 if(synthetic){let [sv,sc]=stscRead(child(stbl,stscT)),chunks=stcoRead(child(stbl,stcoT))[1].length;sc.push([chunks+1,synthCount,1]);stbl=rebuild(stbl,new Map([['stsc:0',stscWrite(sv,sc)]]))}
 let [zv,ss]=stszRead(child(stbl,stszT));if(synthetic)ss=ss.concat(Array(synthCount).fill(8));stbl=rebuild(stbl,new Map([['stsz:0',stszWrite(zv,ss)]]));
 let [ov,oo]=stcoRead(child(stbl,stcoT));oo=oo.map(x=>x+delta);if(synthetic)oo.push(synthOffset);stbl=rebuild(stbl,new Map([['stco:0',stcoWrite(ov,oo)]]));
 minf=rebuild(minf,new Map([['stbl:0',stbl]]));md=rebuild(md,new Map([['minf:0',minf]]));
 return rebuild(t,new Map([['mdia:0',md]]))
}
function patchVideo(t,delta){
 t=rebuild(t,new Map(),[edtsT]);let md=child(t,mdiaT),minf=child(md,minfT),stbl=child(minf,stblT),[v,oo]=stcoRead(child(stbl,stcoT));
 stbl=rebuild(stbl,new Map([['stco:0',stcoWrite(v,oo.map(x=>x+delta))]]));
 return rebuild(t,new Map([['mdia:0',rebuild(md,new Map([['minf:0',rebuild(minf,new Map([['stbl:0',stbl]]))]]))]]))
}
function mainPatch(d){
 const top=boxes(d,0,d.length),mo=top.find(x=>eq(x.t,new TextEncoder().encode('moov'))),md=top.find(x=>eq(x.t,new TextEncoder().encode('mdat')));
 if(!mo||!md)throw Error('Not a supported MP4 file.');
 const moov=mo.x,tracks=boxes(moov,8,moov.length).filter(x=>eq(x.t,trakT)).map(x=>x.x);
 const audio=tracks.find(t=>eq(handler(t),sounT));if(!audio)throw Error('No audio track found.');
 const stbl=child(child(child(audio,mdiaT),minfT),stblT),real=stszRead(child(stbl,stszT))[1].length,synth=real*9;
 function make(delta,off){
  let out=[];for(const x of boxes(moov,8,moov.length)){
   if(!eq(x.t,trakT)){out.push(x.x);continue}
   const h=handler(x.x);if(eq(h,videT))out.push(patchVideo(x.x,delta));else if(eq(h,sounT)){out.push(patchAudio(x.x,delta));out.push(patchAudio(x.x,delta,true,off,synth,3))}else out.push(x.x)
  }
  out=out.filter(x=>!eq(x.slice(0,4),udtaT));out.push(siteUdta());return box(moovT,concat(out))
 }
 let m1=make(0,0),newStart=md.i+m1.length-moov.length,delta=newStart-md.i,so=newStart+md.n,m2=make(delta,so);
 newStart=md.i+m2.length-moov.length;delta=newStart-md.i;so=newStart+md.n;m2=make(delta,so);
 const fake=new Uint8Array(8*synth);for(let i=0;i<synth;i++)fake.set([0,0,0,4,0,0,0,0],i*8);
 return concat([d.slice(0,mo.i),m2,d.slice(mo.i+mo.n),fake])
}

async function patch(){
 if(!selected)return;
 btn.disabled=true;prog.hidden=false;prog.value=10;show('Reading video…');
 try{
  const bytes=new Uint8Array(await selected.arrayBuffer());prog.value=45;show('Patching MP4 boxes and audio track…');
  const out=mainPatch(bytes);prog.value=90;show('Preparing download…');
  const base=selected.name.replace(/\.[^.]+$/,'');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'video/mp4'}));a.download=base+'_4tif.mp4';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);prog.value=100;show('Done — patched video downloaded.','success');
 }catch(e){show(e.message||'Could not patch this video.','error')}
 finally{btn.disabled=false;setTimeout(()=>{prog.hidden=true;prog.value=0},900)}
}
btn.onclick=patch;
</script>
</body>
</html>
